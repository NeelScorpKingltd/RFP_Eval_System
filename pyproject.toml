[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["unit", "integration", "ui", "live_llm"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["rfp_eval"]

[[tool.mypy.overrides]]
module = "fitz"
ignore_missing_imports = true
